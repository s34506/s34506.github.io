<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Yaowadee</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <a href="index.html" class="logo">
        姚 <span>YAO</span>
    </a>

    <nav>
        <a href="index.html">HOME</a>
        <a href="about.html">ABOUT</a>
        <a href="activities.html">ACTIVITIES</a>
        <a href="skills.html">SKILLS</a>
        <a href="contact.html" class="active">CONTACT</a>
    </nav>

    <button class="menu-btn">☰</button>

</header>


<section class="page">

    <div class="page-title reveal">

        <p>
            联系我 · LIÁNXÌ WǑ
        </p>

        <h1>
            CONTACT <span>ME</span>
        </h1>

    </div>


    <div class="contact-grid">


        <div class="contact-info reveal">

            <div class="contact-symbol">
                联系
            </div>

            <h2>
                Let's connect!
            </h2>

            <p>
                ขอบคุณที่เข้ามาเยี่ยมชม Portfolio
                ของฉัน หากต้องการติดต่อ
                สามารถติดต่อได้ตามช่องทางด้านล่าง
            </p>


            <div class="contact-item">

                <span>✉</span>

                <div>
                    <small>EMAIL</small>
                    <p>your@email.com</p>
                </div>

            </div>


            <div class="contact-item">

                <span>☎</span>

                <div>
                    <small>PHONE</small>
                    <p>08X-XXX-XXXX</p>
                </div>

            </div>


            <div class="contact-item">

                <span>◎</span>

                <div>
                    <small>SOCIAL MEDIA</small>
                    <p>@yourusername</p>
                </div>

            </div>

        </div>


        <div class="contact-form reveal">

            <h2>
                ส่งข้อความถึงฉัน
            </h2>

            <form id="contactForm">

                <label for="name">
                    ชื่อของคุณ
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="กรอกชื่อ"
                    required
                >


                <label for="email">
                    อีเมล
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="กรอกอีเมล"
                    required
                >


                <label for="message">
                    ข้อความ
                </label>

                <textarea
                    id="message"
                    rows="5"
                    placeholder="เขียนข้อความ..."
                    required
                ></textarea>


                <button
                    type="submit"
                    class="gold-btn"
                >
                    SEND MESSAGE →
                </button>


                <p id="formMessage"></p>

            </form>

        </div>

    </div>

</section>


<script src="script.js"></script>

</body>
</html>
