            </h2>



            <!-- =========================

            <div class="activity-main-image">

            <h2>

                กิจกรรมร้องเพลงประสานเสียง

                <div class="activity-image">

                    <img src="activity2.jpg"

                <div class="activity-image">

                    <img src="activity5.jpg"
                         alt="กิจกรรมภาษาจีน 5">

                </div>

            </div>



            <!-- คำอธิบาย -->
            <div class="activity-description">

                <p>

                    อันนี้เป็นกิจกรรมต่าง ๆ
                    ทั้งออกบูธภาษาจีน
                    เข้าร่วมงานวันตรุษจีน
                    และค่ายภาษาจีนต่าง ๆ ค่ะ
